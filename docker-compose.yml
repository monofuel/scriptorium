services:
  scriptorium:
    init: true
    restart: unless-stopped
    build:
      context: .
    volumes:
      - .:/workspace
      - ~/.codex:/home/scriptorium/.codex
      - ~/.claude:/home/scriptorium/.claude
      - ~/.claude.json:/home/scriptorium/.claude.json
      - ~/.grok:/home/scriptorium/.grok
      - ~/.ssh:/home/scriptorium/.ssh:ro
    working_dir: /workspace
    environment:
      - OPENAI_API_KEY
      - CODEX_API_KEY
      - ANTHROPIC_API_KEY
      - XAI_API_KEY
    command: ["run"]

  dashboard:
    init: true
    restart: unless-stopped
    build:
      context: .
    volumes:
      - .:/workspace
    working_dir: /workspace
    ports:
      - "8098:8098"
    command: ["dashboard"]

  mattermost:
    init: true
    restart: unless-stopped
    build:
      context: .
    volumes:
      - .:/workspace
      - ~/.codex:/home/scriptorium/.codex
      - ~/.claude:/home/scriptorium/.claude
      - ~/.claude.json:/home/scriptorium/.claude.json
      - ~/.grok:/home/scriptorium/.grok
      - ~/.ssh:/home/scriptorium/.ssh:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    working_dir: /workspace
    env_file: .env
    environment:
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    command: ["mattermost"]
