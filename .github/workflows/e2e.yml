name: End-To-End Tests

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: treeform/setup-nim-action@v6
        with:
          nim-version: "2.2.14"
      - name: Require credentials for every supported backend
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$ANTHROPIC_API_KEY"
          test -n "$XAI_API_KEY"
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libpcre3-dev libssl-dev libcurl4-openssl-dev
      - name: Install pinned Nimby
        run: |
          curl -fsSL https://github.com/treeform/nimby/releases/download/0.2.4/nimby-Linux-X64 -o "$RUNNER_TEMP/nimby"
          sudo install -m755 "$RUNNER_TEMP/nimby" /usr/local/bin/nimby
      - run: make setup agent-setup build
      - run: make e2e-test
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            .build/test-results
            .build/live
